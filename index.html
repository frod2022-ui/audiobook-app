<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="theme-color" content="#0a0a0a"><meta name="color-scheme" content="dark"><title>Wisdom Audio</title><meta name="description" content="Wisdom Audio: discover and listen to full-length audiobooks."><meta property="og:title" content="Wisdom Audio"><meta property="og:description" content="Discover and listen to full-length audiobooks."><meta name="apple-mobile-web-app-title" content="Wisdom Audio"><meta name="application-name" content="Wisdom Audio"><link rel="apple-touch-icon" href="/logo.svg"><link rel="icon" type="image/svg+xml" href="/logo.svg">

<link rel="stylesheet" href="style.css"></head><body>
<header class="top"><button id="menu" class="menubtn" aria-label="Open menu" aria-controls="side" aria-expanded="false">☰</button><div class="brand"><img class="mark" src="/logo.svg" alt="Wisdom logo"><h1 class="wordmark">Wisdom<br>Audio</h1></div>
</header>
<div class="layout"><div id="scrim" hidden></div><aside id="side" aria-label="Browse"><div class="sidehead">Browse</div><nav class="sidetabs"><button data-v="home" class="tab on">Discover</button><button data-v="allv" class="tab">All</button><button data-v="library" class="tab">Library</button></nav><div class="sidehead">Categories</div><div id="chips" class="chips"></div></aside>
<main>
<form id="f" class="searchbar"><input id="q" type="search" placeholder="Search audiobooks, lectures, talks or podcasts…" autocomplete="off"><button>Search</button></form>
<section id="home"><div id="rows"></div><button id="more" class="loadmore">Show me more categories</button></section>
<section id="results" hidden><div class="rowhead"><h2>Listen now</h2><button class="link" id="clear">← Back to Discover</button></div><div class="rowhead"><span id="ytcount" class="s"></span></div><div id="yt" class="shelf wrap"></div><button id="ytmore" class="loadmore" hidden>Show me more</button></section>
<section id="allv" hidden><div class="rowhead"><h2>All Audiobooks</h2><span id="acount" class="s">0 audiobooks loaded</span></div><div id="aaz" class="az"></div><div id="all"></div><button id="aload" class="loadmore">Keep exploring</button></section>
<section id="library" hidden><h2>Your library</h2><div id="laz" class="az"></div><div id="lib"></div></section>
</main></div>
<footer class="sitefoot"><span class="donate-wrap"><small class="donate-cap">Apple Pay</small><a class="pill-btn solid" id="donateBtn2" href="sms:3074090646&amp;body=Donations%20%2A%20Comments%20%2A%20Requests" title="Buy me a coffee: opens Messages for donations, comments or requests"><span class="coffee-ico" aria-hidden="true">☕</span><span class="lbl">Buy me a coffee</span></a></span></footer>
<div id="player" hidden><div class="pbar"><img class="pmark" src="/logo.svg" alt="Wisdom"><div class="pmeta"><b id="ptitle"></b><span id="psub" class="psub" hidden></span><span id="pauthor" class="s"></span><span id="ptime" class="s"></span></div>
<button id="gback" class="ic" aria-label="Back 15 seconds">↺15</button><button id="gpp" class="ic" aria-label="Play/Pause">⏸</button><button id="gstop" class="ic" aria-label="Stop" title="Stop">■</button><select id="speed" aria-label="Speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select>
<button id="toggle" class="ic" aria-label="Show video">▾</button><button id="close" class="ic" aria-label="Close">✕</button></div><div id="pmsg" class="pmsg" role="status" hidden></div><input id="gseek" class="gseek" type="range" min="0" max="1000" value="0" aria-label="Seek"><div class="frame"><div id="yt-frame"></div></div></div>
<dialog id="pick"><h3 id="pickt"></h3><div id="picks" class="shelf wrap"></div><button onclick="pick.close()">Cancel</button></dialog>
<div id="toast"></div>
<script src="https://www.youtube.com/iframe_api"></script><script src="app.js"></script></body></html>
